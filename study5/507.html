<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, td{
            border: 1px solid black;
            border-collapse: collapse;
        }
        td{
            padding: 5px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    
    <script>
        var i, j;
    
        for(i = 0 ; i < rowNum; i++){
            for(j = 1; j <= colNum; j++){
                seatNo = i * colNum + j;
                if(seatNo > memNum) break;
                document.write("<br");
                
            }
            document.write("<br>");
        }
        document.write("<table>");
            for(var i = 0; i<rowNum; i++){
                document.write("<tr>");
                    for(var j = 1; j <= colNum ; j++){
                        seatNo = i * colNum + j;
                        if(seatNo > memNum) break;
                        document.write("<td> 좌석" + seatNo + "</td>");

                    }
                    document.write("</tr>");
            }
            document.write("</table>");
    </script>
</body>
