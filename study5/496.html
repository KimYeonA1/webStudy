<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: inline-block;
            border: 1px solid black;
            margin: 50px;
        }
        div{
            display: inline-block;
            padding: 0 20px 30px 20px;
            margin: 15px;
            border: 1px solid black;
            line-height: 2;
        }
        div h3{
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>&emsp;구구단</h1>
    <script>
        var i, j;
        for(i=1; i<=9 ; i++){
            document.write("<div>");
            document.write("<h3>" + i + "단</h3>");
            for(j = 1 ; j <= 9; j++){
                document.write(i+"X" + j + "=" + i*j + "<br>");

            }
            document.write("</div>");
        }
    </script>
</body>
</html>
