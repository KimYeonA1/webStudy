<!DOCTYPE html>

    <title>Document</title>
    <link rel="stylesheet" href="./css/index.css">
    <script src="./js/index.js"></script>
    <script src="https://kit.fontawesome.com/de7b35df6f.js" crossorigin="anonymous"></script>
    <style>
        
        nav {
            border: 1px dotted black;
            background-color: rgb(237, 239, 194);
            padding: 40px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;

        }
        .logo1 {
            display: flex;

        }
        nav a {
            text-decoration: none;
            color: black;
            margin: 0 10px;
        }
        nav a i {
            margin: 0 5px;
        }
        .footer_box {
            border: 1px dotted black;
            background-color: rgb(245, 220, 153);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: x-large;
        }
        .all {
            display: flex;

        }
        .nav_box, .miri_box, .aside_box {

            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: x-large;
            min-height: 800px;
            min-width: 300px;
        
           
        }
        .nav_box {
            background-color: rgb(169, 228, 148);
        }
        .miri_box {
            background-color: rgb(169, 228, 148);
            flex-direction: column;
            width: 700px;
        }
        .miri_box1 {

            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            font-size: medium;
            margin-top: 20px;
            width: 600px;
            height: 700px;
        }
        .aside_box {
            background-color: rgb(169, 228, 148);
        }

        }

</head>

    <nav>
