<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border: 1px solid rgb(174, 233, 245);
            width: 300px;
        }
        
    </style>
    <script>
        function onLoad(){  //boolean 추가?
            //변수
            let count = 0;
            //객체찾기
            const divobj = document.querySelector("div"); //태그명 삽입
            const btnobj = document.querySelector("button"); //태그명 삽입

            //테이블 추가(열추가를 누르면 테이블이 만들어지도록)
            const table = document.createElement("table");
            table.style.border = "1px solid black";
            table.style.borderCollapse = "collapse";
            table.style.margin = "0 auto";
            divobj.appendChild(table);

            //이벤트 리스너와 핸들러 등록
            btnobj.addEventListener("click", ()=>{//클릭만 하면 난 추가할 거야
                //열을 만든다, 셀을 만든다, 셀내용을 만든다, 테이블에 추가한다.
                const row = table.insertRow(count);      //계속 추가되도록
                row.style.border = "1px solid black";
                const td0 = row.insertCell(0);
                td0.style.border = "1px solid black";
                const td1 = row.insertCell(1);
                td1.style.border = "1px solid black";
                if(flag === false){
                    td0.textContent = `원래셀`;
                    td1.textContent = `원래셀`;
                    flag = true;
                }else{
                    td0.textContent = `추가셀 ${count}`;
                    td1.textContent = `추가셀 ${count}`;

                }
                count++;
            });            
        }
    </script>
</head>
<body onload = "onLoad();">
    <div>

    </div>
    <hr>
    <button>열 추가</button>
</body>
</html>
