<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function onLoad(){
            //객체 찾기
            const myform = window.document.myform;
            const id = window.document.myform.id;
            const pwd = window.document.myform.pwd;
            const chkID = "kya";            //이게 맞으면 전송하도록
            const chkPWD = "1234";
            //이벤트 리스너 등록 및 핸들러 처리
            myform.addEventListener("submit", ()=>{
            event.preventDefault(); //원래 성질의 기능 이벤트를 막는다(서버로 전송기능 막음)

            //패턴검색
            //값체크
            if(id.value !== chkID){
                id.nextSibling.textContent = "아이디가 맞지 않습니다";
                id.value = ""; //아이디가 맞지 않으면 다 지워버리는 기능
                id.focus();
            }else{
                id.nextSibling.textContent = "성공";
                
            }
            
            if(pwd.value !== chkPWD){
                pwd.nextSibling.textContent = "패쓰워드가 맞지 않습니다";
                pwd.value = ""; //아이디가 맞지 않으면 다 지워버리는 기능
                pwd.focus();
            }else{

                pwd.nextSibling.textContent = "성공";
            }
            

            });

        }
    </script>
</head>
<body onload="onLoad();">
    <form action="#" method="get" name="myform">
        <label for="id">ID</label>
        <input type="text" name="id" id="id" placeholder="테스트"><span></span><br>
        <label for="pwd">pwd입력: </label>
        <input type="password" name="pwd" id="pwd" placeholder="암호입력"><span></span><br>
        <button type="submit">전송하기</button>
        <button type="reset">쥐소하기</button>
        <hr>
    </form>
</body>
</html>
