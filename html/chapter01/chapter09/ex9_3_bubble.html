<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div.parent{
            position: relative;
            width: 400px;
            height: 400px;
            border: 1px solid black;
            background-color: rgb(194, 228, 198);
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
            /* align-content: center; 어라인 아이템 안 되면 이거 or absolute?*/
        }
        div.parent > span{
            position: absolute;
            left: 10px;
            top: 10px;
        }
        div.child{
            width: 300px;
            height: 300px;
            border: 1px solid black;
            background-color: rgb(220, 246, 245);
            

        }
    </style>
    <script>
        function onLoad(){
            // 객체찾기
            const divParent = document.querySelector(".parent");
            const divChild = document.querySelector(".child");

            //이벤트 등록 및 핸들러 처리 (버블링 방식)
            divParent.addEventListener("click", ()=>{
                alert(`divParent`);

            });
            divChild.addEventListener("click", ()=>{
                alert(`divChild`);
                event.stopPropagation();
            })
        }
    </script>
</head>
<body onload="onLoad();">
    <div class="parent">
        <span>부모영역</span>
        <div class="child">
            <span>자식영역</span>
        </div>
    </div>
</body>
</html>
