<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 이미지가 안 보일 수 있으므로 크기와 위치를 지정합니다 */
        img {
            width: 100px;
            height: 100px;
            position: absolute;
            transition: transform 0.1s;
        }
    </style>
    <script>
        function onLoad() {
            // 객체 찾기
            const img = document.querySelector("img");
            // 이벤트 리스너 등록 및 핸들러 처리
            window.document.addEventListener("mousemove", (e) => {
                // 마우스 이벤트 정보를 통해서 위치값을 가져온다.
                const x = e.clientX;
                const y = e.clientY;
                img.style.transform = `translate(${x}px, ${y}px)`; 
            });
        }
    </script>
</head>
<body onload="onLoad();">
    <img src="./image/photo3.png.url" alt="">
</body>
</html>
