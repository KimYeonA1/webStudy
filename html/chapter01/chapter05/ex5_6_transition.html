<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body h1:first-child{
            transition: 1s;
        }
        body h1:first-child:hover{
            text-shadow: 7px 7px 8px #57c;
        }
        body h1:nth-child(2){
            transition: 0.5s;
        }
        body h1:nth-child(2):hover{
            text-shadow: 7px 7px 8px rgb(190, 63, 97);
        }
    </style>
</head>
<body>
    <h1>마우스를 올려보세용~☜(ﾟヮﾟ☜)</h1>
    <h1>transiton 위치 변경╰(*°▽°*)╯</h1>
</body>
</html>
