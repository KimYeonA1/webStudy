<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes down {
            0%{
                transform: translateY(0px), scale(1,1) rotateX(0deg);
                /* border-radius: 10%;
                border: 1px dotted black; */
            }
            50%{
                transform: translateY(0px), scale(2,2)rotateX(180deg);
                /* border-radius: 10%;
                border: 1px dotted black;
                width: 400px; */
            }
            100%{
                transform: translateY(0px), scale(1,1)rotateX(0deg);
                /* border-radius: 10%;
                border: 1px dotted black; */
            }
        }
           body img:nth-child(1){
            animation: down 3s;
           }
           body img:nth-child(2){
            animation: down 4s infinite;
           }
           body img:nth-child(3){
            animation: down 4s infinite alternate;
           }
           body img:nth-child(4){
            animation: down 4s linear;
           }
    </style>
</head>
<body>
    <img src="./media/font_a.png.url" alt="">
    <img src="./media/font_f.png.url" alt="">
    <img src="./media/font_c.png.url" alt="">
    <img src="./media/font_f.png.url" alt="">
</body>
</html>
